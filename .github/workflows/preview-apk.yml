name: Build preview APK

# Run it by hand: GitHub > Actions > "Build preview APK" > Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Creates the project on your Expo account the first time (a no-op afterwards).
      - run: eas init --non-interactive --force
      - name: Start the cloud build
        run: |
          eas build --platform android --profile preview --non-interactive --no-wait --json > build.json
          URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].buildDetailsPageUrl)")
          echo "## Install link (open on your Android phone)" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Build page: $URL"
